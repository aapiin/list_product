<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@digigift.id</title>
<meta name="description" content="Produk digital digigift.id">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2fb;
    --card: #ffffff;
    --ink: #1f1b3d;
    --muted: #6f6b8a;
    --accent: #5b3fd9;
    --line: #e6e2f5;
    --wa: #25d366;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Jost', 'Futura', 'Trebuchet MS', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 48px 20px 120px; }

  /* Profil */
  .profile { text-align: center; }
  .pp {
    width: 116px; height: 116px; border-radius: 50%;
    margin: 0 auto 16px;
    background: #b9b5cf;
    border: 4px solid #fff;
    box-shadow: 0 0 0 2px var(--line);
    overflow: hidden;
  }
  .pp img { width: 100%; height: 100%; object-fit: cover; display: block; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: .2px; }
  .bio { margin-top: 6px; color: var(--muted); font-size: 16px; }

  h2 { font-size: 18px; font-weight: 600; margin: 36px 4px 14px; }

  /* Produk */
  .list { display: grid; gap: 12px; }
  .item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
  }
  .thumb {
    flex: none; width: 72px; height: 72px; border-radius: 12px;
    background: linear-gradient(135deg, #d9d2f7, #efe9ff);
    overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { flex: 1; min-width: 0; }
  .info strong { display: block; font-size: 18px; font-weight: 600; line-height: 1.2; }
  .price { display: block; margin-top: 4px; font-size: 16px; color: var(--muted); }
  .demo {
    flex: none;
    padding: 9px 14px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 15px; font-weight: 500;
    transition: background .15s;
  }
  .demo:hover { background: #4529b8; }
  .demo:focus-visible, .wa:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* WhatsApp mengambang */
  .wa {
    position: fixed; right: 20px; bottom: 20px;
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--wa);
    display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }
  .wa svg { width: 34px; height: 34px; fill: #fff; }

  @media (max-width: 380px) {
    .item { flex-wrap: wrap; }
    .info { flex-basis: calc(100% - 90px); }
    .demo { margin-left: 86px; }
  }
</style>
</head>
<body>
<main class="wrap">

  <header class="profile">
    <div class="pp">
      <!-- GANTI foto profil: ubah nama file di src -->
      <img src="pp.jpeg" alt="Foto profil digigift.id" onerror="this.style.display='none'">
    </div>
    <h1>@digigift.id</h1>
    <p class="bio">Produk digital untuk kado dan momen spesialmu</p>
  </header>

  <h2>Product kita</h2>

  <section class="list">

    <!-- ===== PRODUK 1 ===== -->
    <article class="item">
      <div class="thumb"><img src="produk1.jpg" alt="" onerror="this.style.display='none'"></div>
      <div class="info">
        <strong>Nama proyek</strong>
        <span class="price">Rp 8.000</span>
      </div>
      <a class="demo" href="https://aapiin.github.io/demo-bunga/" target="_blank" rel="noopener">Lihat demo</a>
    </article>
    <!-- ===== AKHIR PRODUK 1 ===== -->

    <!-- ===== PRODUK 2 ===== -->
       <article class="item">
      <div class="thumb"><img src="produk1.jpg" alt="" onerror="this.style.display='none'"></div>
      <div class="info">
        <strong>Nama proyek</strong>
        <span class="price">Rp 5.000</span>
      </div>
      <a class="demo" href="https://contoh.com/demo-1" target="_blank" rel="noopener">Lihat demo</a>
    </article>
    <!-- ===== AKHIR PRODUK 2 ===== -->

  </section>
</main>
